name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Target IP address or domain"
        required: true
        type: string
      username:
        description: "SSH username (e.g. ubuntu, root, kadhir)"
        required: true
        default: "ubuntu"
        type: string
      ssh_port:
        description: "SSH port"
        required: false
        default: "22"
        type: string
      deploy_path:
        description: "Destination folder on target server"
        required: false
        default: "/opt/doc-holler"
        type: string
      ssh_password:
        description: "SSH password (leave blank if using SSH_PRIVATE_KEY secret)"
        required: false
        default: ""
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute deployment on remote host
        env:
          TARGET_HOST: ${{ inputs.host }}
          TARGET_USER: ${{ inputs.username }}
          TARGET_PORT: ${{ inputs.ssh_port }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          SSH_PASS: ${{ inputs.ssh_password }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "$SSH_PASS" ]; then
            echo "::add-mask::$SSH_PASS"
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            SSH_CMD="sshpass -p $SSH_PASS ssh -o StrictHostKeyChecking=no -p $TARGET_PORT"
          elif [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            SSH_CMD="ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p $TARGET_PORT"
          else
            echo "Error: Neither SSH_PRIVATE_KEY secret nor ssh_password input was provided."
            exit 1
          fi

          $SSH_CMD "$TARGET_USER@$TARGET_HOST" "
            set -e

            if ! command -v docker &> /dev/null || ! docker compose version &> /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq ca-certificates curl git
              sudo install -m 0755 -d /etc/apt/keyrings
              sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc || sudo curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
              sudo chmod a+r /etc/apt/keyrings/docker.asc
              DISTRO_ID=\$(. /etc/os-release && echo \"\$ID\")
              DISTRO_CODENAME=\$(. /etc/os-release && echo \"\${UBUNTU_CODENAME:-\$VERSION_CODENAME}\")
              echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/\$DISTRO_ID \$DISTRO_CODENAME stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -qq
              sudo apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker \$USER || true
            fi

            sudo mkdir -p '$DEPLOY_PATH'
            sudo chown -R \$USER:\$USER '$DEPLOY_PATH'

            if [ ! -d '$DEPLOY_PATH/.git' ]; then
              rm -rf '$DEPLOY_PATH'/*
              git clone https://github.com/kadhir-17/doc-holler.git '$DEPLOY_PATH'
            fi

            cd '$DEPLOY_PATH'
            git fetch origin main
            git reset --hard origin/main

            if [ -n '$OPENROUTER_KEY' ]; then
              if [ ! -f .env ]; then
                cp .env.example .env
              fi
              grep -q '^OPENROUTER_API_KEY=' .env && sed -i \"s|^OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=$OPENROUTER_KEY|\" .env || echo \"OPENROUTER_API_KEY=$OPENROUTER_KEY\" >> .env
            fi

            if docker info &> /dev/null; then
              DC_CMD='docker compose'
              DOCKER_CMD='docker'
            else
              DC_CMD='sudo docker compose'
              DOCKER_CMD='sudo docker'
            fi

            \$DC_CMD down || true
            \$DOCKER_CMD builder prune -af || true
            \$DOCKER_CMD system prune -af || true
            \$DC_CMD up --build -d

            echo 'Deployment complete. Application is running on port 8000.'
          "
