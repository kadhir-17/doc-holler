services:
  doc-holler:
    build:
      context: .
      dockerfile: Dockerfile
    image: doc-holler:latest
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-haiku}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_TIMEOUT_SECONDS=${OPENROUTER_TIMEOUT_SECONDS:-60.0}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-doc_holler_chunks}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-5}
      - RELEVANCE_DISTANCE_THRESHOLD=${RELEVANCE_DISTANCE_THRESHOLD:-1.0}
      - CHUNK_SIZE_WORDS=${CHUNK_SIZE_WORDS:-250}
      - CHUNK_OVERLAP_WORDS=${CHUNK_OVERLAP_WORDS:-40}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
